條款清單，不分現售/停售，含大量舊商品（例如 (85) 年代商品、附加特約）。現售狀態無法從此文件判定。","名稱照 PDF 文字擷取；英數字前後的空格（如「台灣人壽 e 微保…」「金放心 85 …」）可能是 PDF 抽字造成的，商品頁上的寫法沒有空格（如「台灣人壽e微保微型一年定期壽險【限本公司特定通路銷售】」）。","條款 PDF 內的「契約條款下載」超連結 WebFetch 讀不到，所以 clauseUrl 只填有到官方商品頁（/product/...）讀到「條款」連結的 20 筆；其餘都是 null。","code 取自官方商品頁網址最後一段（例如 /product/40/NTLC0901 → NTLC0901），共 24 筆；其中全心全憶（YMDL）、與糖同行（T05N0）、安心意保（YADDM）的網址來自官網搜尋結果與頁面連結，商品頁本身沒讀，clauseUrl 為 null。productPageUrl 是額外加的欄位，方便追溯。","role 依名稱字面判斷：名稱含「附加條款」或「批註條款」→「附加條款」（批註條款也歸這類）；含「附約」或「特約」→「附約」；其他→「主約」。","approval 全部是 null：File/10904（共38頁，含核准/備查日期及文號）因摘要工具引用長度限制，無法可靠地逐字擷取。version 填的是條款清單的文件日期 2026/10/12。","台灣人壽樂齡心安定期傷害保險（NTPA4101）只出現在保障型商品頁，不在 2026/10/12 的條款清單內（可能是新商品），另外列為一筆。","商品分類頁（壽險保障、健康醫療、意外傷害、年金保險、附加與批註條款）和保障型商品第2頁以後都是 JavaScript 載入，讀不到內容。"]},{company:"凱基人壽",key:"kgi",checked:"2026-10-18",listPages:[{url:"https://www.kgilife.com.tw/zh-tw/footer/corp/publicinfo/piinsurance-products/202412-insurance-products-clause",title:"契約條款（資訊公開＞各項保險商品）"},{url:"https://www.kgilife.com.tw/zh-tw/footer/corp/publicinfo/piinsurance-products/202412-insurance-products-no",title:"保險商品之文號與日期"},{url:"https://www.kgilife.com.tw/zh-tw/-/media/files/kgil/footer/corp/publicinfo/piinsurance-products/date_pd1.pdf",title:"保險商品之文號與日期－人壽/年金保險（PDF，維護日期115/10/01）"},{url:"https://www.kgilife.com.tw/zh-tw/-/media/files/kgil/footer/corp/publicinfo/piinsurance-products/date.pdf",title:"保險商品之文號與日期－健康/傷害/團險/微型保險（PDF，維護日期115/09/25）"}],items:[{name:"凱基人壽全民小額終身壽險",code:null,role:"主約",type:"人壽/年金保險",clauseUrl:"https://www.kgilife.com.tw/zh-tw/-/media/files/kgil/product-overview/personal/life-refund/clause/whole-life-protection/ehjipl.pdf",sourceUrl:"https://www.kgilife.com.tw/zh-tw/footer/corp/publicinfo/piinsurance-products/202412-insurance-products-clause",approval:"中壽商一字第 1060327002 號（106.03.27）",version:null},{name:"凱基人壽公教小額終身壽險",code:null,role:"主約",type:"人壽/年金保險",clauseUrl:"https://www.kgilife.com.tw/zh-tw/-/media/files/kgil/product-overview/personal/life-refund/clause/whole-life-protection/epfppl.pdf",s
